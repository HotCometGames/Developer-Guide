site_name: Developer Handbook
site_description: A personal engineering reference manual for software developers.
site_url: "https://hotcometgames.github.io/Developer-Guide/"

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

repo_url: "https://github.com/HotCometGames/Developer-Guide"
edit_uri: ""

